<!-- FLOW: app.py /add-expense renders this page, then add_expense.js sends records to /api/expenses. -->
{% extends 'base.html' %}{% block content %}<header class="page-head"><div><h1>Record Expenses</h1><p>Add one expense or save multiple rows at once.</p></div></header><div class="tabs"><button class="tab active" data-target="single-entry">Single Entry</button><button class="tab" data-target="batch-entry">Batch Entry</button></div><section id="single-entry" class="tab-panel active card"><form id="expense-form" class="form-grid"><label>Amount (<span class="currency">₹</span>)<input id="amount" type="number" min="0" step="50" required></label><label>Category<select id="category">{% for c in categories %}<option>{{c}}</option>{% endfor %}</select></label><label>Date<input id="expense-date" type="date" value="{{today}}" required></label><label>Description<input id="description" placeholder="e.g. Weekly grocery purchase"></label><div class="form-actions"><button class="primary">Add Expense</button></div></form></section><section id="batch-entry" class="tab-panel card"><div class="card-head"><div><h2>Quick Multi-Row Entry</h2><p>Enter multiple expenses and submit in one transaction.</p></div><button id="add-row" class="secondary">+ Add Row</button></div><div class="table-wrap"><table><thead><tr><th>Amount</th><th>Category</th><th>Description</th><th>Date</th><th></th></tr></thead><tbody id="batch-body"></tbody></table></div><button id="save-batch" class="primary">Save All Records</button></section>{% endblock %}{% block scripts %}<script src="{{url_for('static',filename='js/add_expense.js')}}"></script>{% endblock %}
