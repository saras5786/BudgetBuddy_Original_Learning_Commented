<!-- FLOW: app.py /budget-planner renders this page, then budget_planner.js calls /api/budgets. -->
{% extends 'base.html' %}{% block content %}<header class="page-head"><div><h1>Budget Planner</h1><p>Set monthly spending limits and track consumption in real time.</p></div></header><div class="grid-2"><div class="card"><h2>Set Category Limit</h2><form id="budget-form"><label>Category<select id="budget-category">{% for c in categories %}<option>{{c}}</option>{% endfor %}</select></label><label>Monthly Limit (<span class="currency">₹</span>)<input id="budget-limit" type="number" min="0" step="500" value="0"></label><button class="primary full">Save Limit</button></form></div><div class="card"><div class="card-head"><div><h2>Active Category Budgets</h2><p id="budget-meta"></p></div></div><div id="budget-list"></div></div></div>{% endblock %}{% block scripts %}<script src="{{url_for('static',filename='js/budget_planner.js')}}"></script>{% endblock %}
