<!-- FLOW: app.py /expense-history renders this page, then expense_history.js reads /api/expenses. -->
{% extends 'base.html' %}{% block content %}<header class="page-head"><div><h1>Expense History</h1><p>Filter, export and manage every recorded transaction.</p></div></header><div class="card"><div class="filter-grid"><label>Filter Category<select id="filter-category"><option>All</option>{% for c in categories %}<option>{{c}}</option>{% endfor %}</select></label><label>Search Description<input id="search-query" placeholder="Keyword..."></label><label>Minimum Amount (<span class="currency">₹</span>)<input id="min-amount" type="number" min="0" step="100" value="0"></label><label>Sort Order<select id="sort-order"><option>Newest First</option><option>Oldest First</option><option>Highest Amount</option><option>Lowest Amount</option></select></label></div><div class="table-summary" id="history-summary"></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Amount</th><th>Category</th><th>Description</th><th>Date</th><th>Action</th></tr></thead><tbody id="history-body"></tbody></table></div><div class="action-row"><a id="csv-export" class="secondary button-link">Export Filtered CSV</a><a class="secondary button-link" href="/api/export/excel">Export Filtered Excel</a></div></div>{% endblock %}{% block scripts %}<script src="{{url_for('static',filename='js/expense_history.js')}}"></script>{% endblock %}
