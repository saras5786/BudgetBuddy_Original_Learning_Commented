<!-- FLOW: Starting screen. Login -> app.py /login. Signup -> /signup. Demo -> /demo. -->
{% extends 'base.html' %}{% block content %}<div class="auth-page"><div class="auth-card"><div class="auth-logo">₹</div><h1>Budget Buddy</h1><p>Personal Expense Tracking and Dataset Analysis</p><div class="auth-tabs"><button class="auth-tab active" data-tab="login">Sign In</button><button class="auth-tab" data-tab="signup">Sign Up</button><button class="auth-tab" data-tab="demo">Demo Access</button></div><section id="login" class="auth-panel active"><h2>Account Login</h2><form method="post"><label>Email Address<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button class="primary full">Sign In</button></form></section><section id="signup" class="auth-panel"><h2>Create Account</h2><form method="post" action="{{url_for('signup')}}"><label>Email Address<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="4" required></label><label>Confirm Password<input name="confirm" type="password" minlength="4" required></label><button class="primary full">Create Account</button></form></section><section id="demo" class="auth-panel"><h2>Instant Access</h2><p>Explore Budget Buddy with a pre-configured profile without registration.</p><form method="post" action="{{url_for('demo')}}"><button class="primary full">Launch Demo Account</button></form></section></div></div>{% endblock %}
